name: drift-sentinel

volumes:
  postgres_data:
  mlflow_artifacts:

# Shared by every Airflow service. Anchored so a change to the database URL or
# image tag happens in exactly one place.
x-airflow-common: &airflow-common
  image: apache/airflow:3.3.0
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://drift:drift@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    # Dev-only. Signs task-to-API-server callbacks; would be a real secret if deployed.
    AIRFLOW__API_AUTH__JWT_SECRET: dev-only-not-a-real-secret
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
  # Run as the host user so bind-mounted logs/dags stay readable outside the
  # container. Falls back to the image's own UID if AIRFLOW_UID is unset.
  user: "${AIRFLOW_UID:-50000}:0"

services:
  postgres:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_USER: drift
      POSTGRES_PASSWORD: drift
      POSTGRES_DB: drift
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drift -d drift"]
      interval: 5s
      timeout: 3s
      retries: 5
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://drift:drift@postgres:5432/drift
      --serve-artifacts
      --artifacts-destination /mlflow/artifacts
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 5

  # One-shot bootstrap: runs the Airflow schema migration and creates the admin
  # user, then exits. Runs as root so it can hand /opt/airflow to AIRFLOW_UID.
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/dags
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow
        exec /entrypoint airflow version
    environment:
      # Merge the shared settings back in, then add the entrypoint's own
      # underscore-prefixed instructions (these are not Airflow settings).
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy

  # Web UI and REST API. Also serves the execution API that running tasks call
  # back into (see AIRFLOW__CORE__EXECUTION_API_SERVER_URL).
  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 10s
      retries: 5
      # Airflow needs ~20s to boot; without this grace window it would be
      # killed as unhealthy before it ever finished starting.
      start_period: 30s
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # Decides what should run now, and (under LocalExecutor) runs the tasks
  # itself as subprocesses.
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # Parses ./dags/*.py into DAG objects. Split out from the scheduler so a slow
  # or broken DAG file cannot wedge scheduling.
  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
  